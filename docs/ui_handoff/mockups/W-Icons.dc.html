<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megaclonk weapon icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&amp;family=Overpass:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1200px; height: 720px; box-sizing: border-box; padding: 48px 56px; background: #0E0F0E; color: #E8E2D0; font-family: 'Overpass', sans-serif; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'IM Fell English', serif; font-weight: 400; font-size: 52px; line-height: 1">Weapon icons</h1>
<span style="font-weight: 600; font-size: 14px; letter-spacing: 0.24em; color: #8D9188">DRAFT · 32×32 SPRITES SHOWN AT 4×</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{icons}}" as="w" hint-placeholder-count="8">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px 16px; background: #1A1C19; border: 1px solid {{w.border}}">
<sc-if value="{{w.tag}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 10px; right: 10px; font-weight: 800; font-size: 11px; letter-spacing: 0.18em; padding: 3px 7px 1px; background: #7E1820; color: #F4EFE2">{{w.tag}}</span></sc-if>
<img src="{{w.src}}" alt="{{w.name}} icon" style="width: 128px; height: 128px; image-rendering: pixelated">
<span style="font-family: 'IM Fell English', serif; font-size: 26px; line-height: 1">{{w.name}}</span>
<span style="font-size: 14px; color: #8D9188; text-align: center">{{w.line}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    var B = '';
    var list = [
      ['Lightning Staff', '../icons_4x/weapons/lightning.png', 'Sky strike · bounces', ''],
      ['Bow', '../icons_4x/weapons/bow.png', 'Piercing · fan volley', ''],
      ['Revolver', '../icons_4x/weapons/revolver.png', 'Silver bullet · ricochet', ''],
      ['Aura', '../icons_4x/weapons/aura.png', 'Floor sigil · pulses', ''],
      ['Scythes', '../icons_4x/weapons/scythes.png', 'Thrown · returns', 'RENAMED'],
      ['Shotgun', '../icons_4x/weapons/shotgun.png', 'Short-range cone', 'NEW'],
      ['Sword', '../icons_4x/weapons/sword.png', 'Slash bursts', ''],
      ['Firestaff', '../icons_4x/weapons/firestaff.png', 'Fireball · knockback', '']
    ];
    return {
      icons: list.map(function (r) {
        return { name: r[0], src: B + r[1], line: r[2], tag: r[3], border: r[3] ? '#7E1820' : '#3A3D38' };
      })
    };
  }
}
</script>
</body>
</html>
