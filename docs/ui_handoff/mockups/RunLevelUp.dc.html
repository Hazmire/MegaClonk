<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megaclonk — Level up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English&amp;family=Overpass:wght@400;600;800&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes mcFlash{0%{opacity:.9}100%{opacity:0}}
@keyframes mcShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-12px,7px)}26%{transform:translate(10px,-8px)}40%{transform:translate(-7px,5px)}55%{transform:translate(5px,-4px)}70%{transform:translate(-3px,2px)}85%{transform:translate(1px,-1px)}}
@keyframes mcRing{0%{transform:translate(-50%,-50%) scale(.15);opacity:1}100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
@keyframes mcSlam{0%{transform:scale(2.8);opacity:0}45%{transform:scale(.93);opacity:1}62%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes mcRays{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(45deg)}}
@keyframes mcOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes mcDeal{0%{transform:translateY(180px) rotate(12deg) scale(.7);opacity:0}70%{transform:translateY(-16px) rotate(-1deg) scale(1.03);opacity:1}100%{transform:none;opacity:1}}
@keyframes mcFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mcNum{0%,100%{transform:scale(1)}40%{transform:scale(1.9)}}
@keyframes mcRareBurst{0%{transform:scale(.85);opacity:.95}100%{transform:scale(1.6);opacity:0}}
@keyframes mcSpark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x,0),var(--y,-60px)) scale(.2);opacity:0}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; font-family: 'Overpass', sans-serif; color: #E8E2D0; background-color: #8C978F; background-image: repeating-conic-gradient(#8F9A92 0 25%, #87928A 0 50%); background-size: 16px 16px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background-color: #1F2620; background-image: repeating-conic-gradient(#212821 0 25%, #1C221D 0 50%); background-size: 16px 16px"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,11,10,0.72)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%)"></div>

<sc-if value="{{play}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; animation: mcShake 0.5s ease-out 0.08s both">

<div role="status" aria-label="Run status" style="position: absolute; left: 72px; top: 36px; display: flex; align-items: flex-end; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">LVL</span><span style="display: inline-block; font-weight: 800; font-size: 32px; line-height: 1; color: #F2C14E; text-shadow: 3px 3px 0 #050505; animation: mcNum 0.6s ease-out 0.3s both">4</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">STAGE</span><span style="font-weight: 800; font-size: 32px; line-height: 1; text-shadow: 3px 3px 0 #050505">1</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 240px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">HP</span><div style="height: 24px; background: #2A1416; border: 2px solid #050505"><div style="width: 63%; height: 100%; background: #7E1820; display: flex; align-items: center; padding-left: 8px; box-sizing: border-box; font-weight: 800; font-size: 14px; color: #F4EFE2; white-space: nowrap">63 / 100</div></div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">GOLD</span><span style="font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 #050505">66</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">TIME</span><span style="font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 #050505">01:24</span></div>
</div>

<div style="position: absolute; left: 72px; top: 150px"><dc-import name="RunInventory" weapons="2" ice="0" hint-size="420px,870px"></dc-import></div>
<div style="position: absolute; left: 1428px; top: 150px"><dc-import name="RunStats" damage="+0%" hint-size="420px,870px"></dc-import></div>

<section aria-labelledby="lvl-h" style="position: absolute; left: 532px; top: 150px; width: 856px; height: 870px; box-sizing: border-box; padding: 32px 40px; background: rgba(14,15,14,0.94); border: 1px solid #4A4D47; display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; flex-direction: column; gap: 8px; animation: mcFadeUp 0.4s ease-out 1.15s both">
<span style="font-weight: 800; font-size: 14px; letter-spacing: 0.3em; color: #F2C14E">LEVEL UP · LEVEL 4</span>
<h1 id="lvl-h" style="margin: 0; font-family: 'IM Fell English', serif; font-weight: 400; font-size: 52px; line-height: 1">Choose an upgrade</h1>
<div aria-hidden="true" style="width: 48px; height: 5px; background: #7E1820; margin-top: 4px"></div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; padding-top: 10px">

<div style="position: relative; animation: mcDeal 0.55s cubic-bezier(.2,1.3,.4,1) 1.85s both">
<span aria-hidden="true" style="position: absolute; inset: -14px; border: 6px solid #6FA8E8; animation: mcRareBurst 0.7s ease-out 2.2s both"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 40%; width: 10px; height: 10px; background: #BFE0FF; animation: mcSpark 0.8s ease-out 2.2s both; --x: -120px; --y: -140px"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 40%; width: 8px; height: 8px; background: #F2F6FB; animation: mcSpark 0.9s ease-out 2.25s both; --x: 130px; --y: -120px"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 40%; width: 12px; height: 12px; background: #6FA8E8; animation: mcSpark 0.8s ease-out 2.2s both; --x: 20px; --y: -190px"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 40%; width: 8px; height: 8px; background: #BFE0FF; animation: mcSpark 0.85s ease-out 2.28s both; --x: -150px; --y: 40px"></span>
<span aria-hidden="true" style="position: absolute; left: 50%; top: 40%; width: 10px; height: 10px; background: #F2F6FB; animation: mcSpark 0.85s ease-out 2.24s both; --x: 150px; --y: 60px"></span>
<button type="button" aria-pressed="true" style="position: relative; display: flex; flex-direction: column; gap: 14px; width: 100%; height: 470px; box-sizing: border-box; padding: 0 20px 18px; border: 4px solid #2B6CB5; outline: 4px solid #B3363F; outline-offset: 6px; background: #D5D6CB; color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: translateY(-10px) rotate(-0.6deg); box-shadow: 0 0 30px 8px rgba(70,140,220,0.5), 6px 10px 0 rgba(0,0,0,0.55)">
<div style="display: flex; justify-content: space-between; align-items: center; margin: 0 -20px; padding: 9px 14px 7px; background: #2B6CB5; color: #F2F6FB">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.24em"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="#F2F6FB"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg>RARE</span>
<span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.14em">LV 1 → 2</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 150px; width: 100%; background: #B9C6CF; border: 2px solid #2B6CB5"><img src="../icons_4x/weapons/lightning.png" alt="" style="width: 104px; height: 104px; image-rendering: pixelated; object-fit: contain"></div>
<span style="font-size: 28px; line-height: 1.05">Lightning Staff</span>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 17px; color: #3A352C">
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Range bonus <b style="font-weight: 400; color: #1C1A15">+0% → +15%</b></span>
</div>
<span style="margin-top: auto; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A5446">[1]</span>
</button>
</div>

<div style="animation: mcDeal 0.5s cubic-bezier(.2,1.3,.4,1) 1.35s both">
<button type="button" aria-pressed="false" style="position: relative; display: flex; flex-direction: column; gap: 14px; width: 100%; height: 470px; box-sizing: border-box; padding: 20px 20px 18px; border: none; background: #CFC7AD; color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: rotate(0.5deg); box-shadow: 5px 7px 0 rgba(0,0,0,0.5)">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.24em; color: #5A5446">COMMON</span>
<span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #8E1B22; border: 2px solid #8E1B22; padding: 2px 7px 0; transform: rotate(-4deg)">NEW</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 150px; width: 100%; background: #C2B99D; border: 2px solid #8F876F"><img src="../icons_4x/weapons/aura.png" alt="" style="width: 104px; height: 104px; image-rendering: pixelated; object-fit: contain"></div>
<span style="font-size: 28px; line-height: 1.05">Aura</span>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 17px; color: #3A352C">
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Type <b style="font-weight: 400; color: #1C1A15">Aura</b></span>
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Base damage <b style="font-weight: 400; color: #1C1A15">8</b></span>
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Cooldown <b style="font-weight: 400; color: #1C1A15">0.60s</b></span>
</div>
<span style="margin-top: auto; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A5446">[2]</span>
</button>
</div>

<div style="animation: mcDeal 0.5s cubic-bezier(.2,1.3,.4,1) 1.55s both">
<button type="button" aria-pressed="false" style="position: relative; display: flex; flex-direction: column; gap: 14px; width: 100%; height: 470px; box-sizing: border-box; padding: 20px 20px 18px; border: none; background: #D3CBB2; color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: rotate(-0.3deg); box-shadow: 5px 7px 0 rgba(0,0,0,0.5)">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%">
<span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.24em; color: #5A5446">COMMON</span>
<span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #8E1B22; border: 2px solid #8E1B22; padding: 2px 7px 0; transform: rotate(3deg)">NEW</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; height: 150px; width: 100%; background: #C2B99D; border: 2px solid #8F876F"><img src="../icons_4x/weapons/bow.png" alt="" style="width: 104px; height: 104px; image-rendering: pixelated; object-fit: contain"></div>
<span style="font-size: 28px; line-height: 1.05">Bow</span>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; font-size: 17px; color: #3A352C">
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Type <b style="font-weight: 400; color: #1C1A15">Pierce</b></span>
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Base damage <b style="font-weight: 400; color: #1C1A15">22</b></span>
<span style="display: flex; justify-content: space-between; border-bottom: 1px dashed #8F876F; padding-bottom: 6px">Cooldown <b style="font-weight: 400; color: #1C1A15">0.90s</b></span>
</div>
<span style="margin-top: auto; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A5446">[3]</span>
</button>
</div>

</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px; animation: mcFadeUp 0.4s ease-out 2.1s both">
<button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 26px; border: none; background: #7E1820; cursor: pointer; font-family: 'IM Fell English', serif; font-size: 36px; color: #F4EFE2"><span style="display: flex; align-items: center; gap: 16px"><span aria-hidden="true" style="width: 12px; height: 12px; background: #F4EFE2"></span>Take Lightning Staff</span><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.2em; color: #F4C9CB">ENTER</span></button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<button type="button" style="height: 54px; border: 1px solid #B3363F; background: transparent; cursor: pointer; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.2em; color: #E07B83">BANISH</button>
<button type="button" style="height: 54px; border: 1px solid #5A5D56; background: transparent; cursor: pointer; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.2em; color: #D9D4C4">SKIP · HEAL 10</button>
<button type="button" style="height: 54px; border: 1px solid #5A5D56; background: transparent; cursor: pointer; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.2em; color: #D9D4C4">REFRESH · 3 LEFT</button>
</div>
</div>

</section>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; animation: mcOut 0.45s ease-in 1.25s forwards">
<div style="position: absolute; inset: 0; background: rgba(5,6,5,0.62)"></div>
<div style="position: absolute; left: 960px; top: 520px; width: 2000px; height: 2000px; border-radius: 50%; background: repeating-conic-gradient(rgba(242,193,78,0.24) 0deg 5deg, rgba(242,193,78,0) 5deg 15deg); animation: mcRays 1.7s linear both"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 48%, rgba(5,6,5,0) 0%, rgba(5,6,5,0) 18%, rgba(5,6,5,0.9) 62%)"></div>
<div style="position: absolute; left: 960px; top: 520px; width: 420px; height: 420px; border-radius: 50%; border: 8px solid #F2C14E; animation: mcRing 0.9s ease-out 0.05s both"></div>
<div style="position: absolute; left: 960px; top: 520px; width: 420px; height: 420px; border-radius: 50%; border: 5px solid #F7DFA0; animation: mcRing 1s ease-out 0.2s both"></div>
<div style="position: absolute; left: 960px; top: 520px; width: 420px; height: 420px; border-radius: 50%; border: 3px solid #B3363F; animation: mcRing 1.1s ease-out 0.35s both"></div>
<div style="position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-weight: 800; font-size: 24px; letter-spacing: 0.6em; color: #F2C14E; animation: mcFadeUp 0.3s ease-out 0.15s both">THE BELL TOLLS</span>
<span style="font-family: 'IM Fell English SC', serif; font-size: 230px; line-height: 0.9; color: #F4EFE2; text-shadow: 0 0 40px rgba(242,193,78,0.85), 6px 6px 0 #050505; animation: mcSlam 0.55s cubic-bezier(.2,1.2,.4,1) 0.05s both">Level 4</span>
<span style="font-weight: 800; font-size: 20px; letter-spacing: 0.3em; color: #D9D4C4; animation: mcFadeUp 0.3s ease-out 0.45s both">CHOOSE 1 OF 3 · ANY KEY TO SKIP</span>
</div>
<div style="position: absolute; inset: 0; background: #FFEDC2; animation: mcFlash 0.35s ease-out both"></div>
</div>

</div>
</sc-if>

<button type="button" onClick="{{replay}}" style="position: absolute; left: 532px; top: 1034px; height: 36px; padding: 0 16px; border: 1px dashed #5A5D56; background: rgba(14,15,14,0.8); cursor: pointer; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: 0.2em; color: #A9ADA4">↺ REPLAY FANFARE</button>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { play: true };
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
  }
  renderVals() {
    var self = this;
    return {
      play: this.state.play,
      replay: function () {
        self.setState({ play: false });
        if (self.timer) clearTimeout(self.timer);
        self.timer = setTimeout(function () { self.setState({ play: true }); }, 50);
      }
    };
  }
}
</script>
</body>
</html>
