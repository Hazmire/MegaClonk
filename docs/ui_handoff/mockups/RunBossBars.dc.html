<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megaclonk — Boss health bars</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&amp;family=IM+Fell+English&amp;family=Overpass:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes bbFlash{0%{opacity:.85}100%{opacity:0}}
@keyframes bbEnrage{0%,100%{box-shadow:0 0 0 1px #050505,0 0 0 0 rgba(224,123,131,0)}50%{box-shadow:0 0 0 1px #050505,0 0 18px 4px rgba(224,123,131,.65)}}
@keyframes bbEnrageMini{0%,100%{box-shadow:0 0 0 1px #050505,0 0 0 0 rgba(242,193,78,0)}50%{box-shadow:0 0 0 1px #050505,0 0 14px 3px rgba(242,193,78,.7)}}
@keyframes bbStamp{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(2.4);opacity:0}60%{transform:translate(-50%,-50%) rotate(-6deg) scale(.92);opacity:1}100%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}}
@keyframes bbIn{0%{transform:scaleX(.05);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes bbArrow{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes bbPip{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; font-family: 'Overpass', sans-serif; color: #E8E2D0; background: #1F2620">
<div style="position: absolute; left: 0; top: 0"><dc-import name="RunHUD" hint-size="1920px,1080px"></dc-import></div>

<!-- STAGE BOSSES -->
<div style="position: absolute; left: 500px; top: 136px; width: 920px; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{stage}}" as="b" hint-placeholder-count="2">
<section aria-label="{{b.name}} health" style="position: relative; display: flex; flex-direction: column; gap: 6px; animation: bbIn 0.35s ease-out both">
<div style="display: flex; align-items: flex-end; gap: 12px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M3 1h10v2h2v7h-2v2h-1v3H4v-3H3v-2H1V3h2z" fill="#0E0F0E"></path><path d="M4 2h8v2h2v5h-2v2h-1v3H5v-3H4V9H2V4h2z" fill="#E8E2D0"></path><path d="M4 6h3v3H4zM9 6h3v3H9z" fill="#7E1820"></path><path d="M7 10h2v1H7z" fill="#0E0F0E"></path></svg>
<span style="font-family: 'IM Fell English SC', serif; font-size: 34px; line-height: 1; color: #F4EFE2; text-shadow: 3px 3px 0 #050505">{{b.name}}</span>
<span style="font-family: 'IM Fell English', serif; font-style: italic; font-size: 19px; line-height: 1.3; color: #C9CEC8; text-shadow: 2px 2px 0 #050505">{{b.epithet}}</span>
<span style="margin-left: auto; font-weight: 800; font-size: 11px; letter-spacing: 0.24em; padding: 3px 7px 1px; background: #7E1820; color: #F4EFE2">STAGE BOSS</span>
<sc-if value="{{b.enraged}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 800; font-size: 11px; letter-spacing: 0.24em; padding: 2px 6px 0; border: 1px solid #E07B83; color: #E07B83; animation: bbPip 0.6s steps(2) infinite">ENRAGED</span></sc-if>
<span style="font-weight: 800; font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; color: #F4EFE2; text-shadow: 2px 2px 0 #050505">{{b.hpText}}<span style="color: #8D9188"> / {{b.maxText}}</span></span>
</div>
<div style="position: relative; display: flex; align-items: center">
<div aria-hidden="true" style="flex: none; width: 10px; height: 34px; background: #3A3D38; box-shadow: inset 0 0 0 2px #050505"><div style="width: 4px; height: 4px; margin: 15px 3px; background: #B9BAB1"></div></div>
<div role="meter" aria-label="{{b.name}} health" aria-valuemin="0" aria-valuemax="{{b.max}}" aria-valuenow="{{b.hp}}" style="position: relative; flex: 1; height: 24px; background: #2A1416; box-shadow: 0 0 0 1px #050505; border-top: 2px solid #050505; border-bottom: 2px solid #050505; animation: {{b.barAnim}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{b.chipPct}}; background: #E8E2D0; opacity: 0.75; transition: width 0.55s ease-in 0.45s"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{b.hpPct}}; background-color: {{b.fill}}; background-image: repeating-conic-gradient(rgba(255,255,255,0.07) 0 25%, rgba(0,0,0,0.08) 0 50%); background-size: 4px 4px; transition: width 0.08s linear"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 5px; background: rgba(255,255,255,0.12)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(10% - 2px), rgba(5,5,5,0.7) calc(10% - 2px), rgba(5,5,5,0.7) 10%)"></div>
<sc-for list="{{b.phases}}" as="p" hint-placeholder-count="2"><div aria-hidden="true" style="position: absolute; left: {{p}}; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; background: #E8E2D0; box-shadow: 0 0 0 1px #050505"></div></sc-for>
<sc-if value="{{b.flash}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; background: #FFFFFF; animation: bbFlash 0.14s linear both"></div></sc-if>
</div>
<div aria-hidden="true" style="flex: none; width: 10px; height: 34px; background: #3A3D38; box-shadow: inset 0 0 0 2px #050505"><div style="width: 4px; height: 4px; margin: 15px 3px; background: #B9BAB1"></div></div>
<sc-if value="{{b.slain}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; top: 50%; font-weight: 800; font-size: 26px; letter-spacing: 0.4em; padding: 6px 12px 3px 22px; color: #F4EFE2; background: #7E1820; box-shadow: 0 0 0 3px #050505, 4px 4px 0 #050505; animation: bbStamp 0.4s ease-out both">SLAIN</span></sc-if>
</div>
<div style="display: flex; align-items: center; gap: 8px; height: 18px; padding-left: 14px">
<sc-for list="{{b.statuses}}" as="s" hint-placeholder-count="2">
<span style="display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 11px; letter-spacing: 0.16em; color: {{s.c}}; text-shadow: 1px 1px 0 #050505; animation: bbPip 1.2s ease-in-out infinite"><svg aria-hidden="true" width="10" height="10" viewBox="0 0 16 16"><path d="M8 1 15 8 8 15 1 8z" fill="{{s.c}}" stroke="#050505" stroke-width="2"></path></svg>{{s.label}}</span>
</sc-for>
</div>
</section>
</sc-for>
</div>

<!-- MINIBOSSES -->
<div style="position: absolute; left: 500px; top: {{miniTop}}px; width: 920px; display: flex; gap: 40px">
<sc-for list="{{minis}}" as="m" hint-placeholder-count="1">
<section aria-label="{{m.name}} health" style="position: relative; width: 440px; display: flex; flex-direction: column; gap: 5px; animation: bbIn 0.3s ease-out both">
<div style="display: flex; align-items: flex-end; gap: 10px">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16"><path d="M8 1 15 8 8 15 1 8z" fill="#D9963A" stroke="#050505" stroke-width="2"></path></svg>
<span style="font-family: 'IM Fell English', serif; font-size: 24px; line-height: 1; color: #F4EFE2; text-shadow: 2px 2px 0 #050505">{{m.name}}</span>
<span style="font-weight: 800; font-size: 10px; letter-spacing: 0.22em; padding: 2px 5px 0; border: 1px solid #D9963A; color: #F2C14E">MINIBOSS</span>
<span style="margin-left: auto; font-weight: 800; font-size: 14px; line-height: 1; font-variant-numeric: tabular-nums; color: #F4EFE2; text-shadow: 2px 2px 0 #050505">{{m.hpText}}<span style="color: #8D9188"> / {{m.maxText}}</span></span>
</div>
<div role="meter" aria-label="{{m.name}} health" aria-valuemin="0" aria-valuemax="{{m.max}}" aria-valuenow="{{m.hp}}" style="position: relative; height: 12px; background: #2B2010; box-shadow: 0 0 0 1px #050505; border: 1px solid #050505; animation: {{m.barAnim}}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{m.chipPct}}; background: #E8E2D0; opacity: 0.7; transition: width 0.5s ease-in 0.4s"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{m.hpPct}}; background-color: #D9963A; background-image: repeating-conic-gradient(rgba(255,255,255,0.08) 0 25%, rgba(0,0,0,0.08) 0 50%); background-size: 4px 4px; transition: width 0.08s linear"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) calc(20% - 2px), rgba(5,5,5,0.7) calc(20% - 2px), rgba(5,5,5,0.7) 20%)"></div>
<sc-if value="{{m.flash}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; inset: 0; background: #FFFFFF; animation: bbFlash 0.14s linear both"></div></sc-if>
<sc-if value="{{m.slain}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 50%; top: 50%; font-weight: 800; font-size: 16px; letter-spacing: 0.34em; padding: 4px 8px 2px 14px; color: #1C1A15; background: #F2C14E; box-shadow: 0 0 0 2px #050505, 3px 3px 0 #050505; animation: bbStamp 0.4s ease-out both">SLAIN</span></sc-if>
</div>
</section>
</sc-for>
</div>

<!-- OFF-SCREEN POINTER (boss outside the camera) -->
<sc-if value="{{pointer}}" hint-placeholder-val="{{ true }}">
<div aria-label="Rock Golem is off-screen to the right, 38 metres away" style="position: absolute; right: 26px; top: 470px; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; background: rgba(14,15,14,0.86); border: 1px solid #B3363F; animation: bbArrow 0.9s ease-in-out infinite">
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px"><span style="font-family: 'IM Fell English SC', serif; font-size: 18px; line-height: 1; color: #F4EFE2">Rock Golem</span><span style="font-weight: 800; font-size: 12px; letter-spacing: 0.16em; color: #E07B83">38 M</span></div>
<svg aria-hidden="true" width="22" height="28" viewBox="0 0 11 14" shape-rendering="crispEdges"><path d="M0 0h3l8 7-8 7H0l8-7z" fill="#B3363F"></path></svg>
</div>
</sc-if>

<!-- MOCKUP CONTROLS -->
<div style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: rgba(14,15,14,0.85); border: 1px dashed #5A5D56">
<span style="font-weight: 800; font-size: 11px; letter-spacing: 0.2em; color: #8D9188; padding: 0 6px">MOCKUP</span>
<sc-for list="{{controls}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.go}}" style="height: 32px; padding: 0 10px; border: 1px solid #5A5D56; background: transparent; cursor: pointer; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 0.16em; color: #D9D4C4">{{c.label}}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stageBosses":{"editor":"enum","options":["0","1","2"],"default":"2"},"minibosses":{"editor":"enum","options":["0","1","2"],"default":"1"},"offscreenPointer":{"editor":"boolean","default":true},"autoplay":{"editor":"boolean","default":true},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      hp: { chunkus: 2367, golem: 3628, brute: 162, hag: 410 },
      chip: { chunkus: 2367, golem: 3628, brute: 162, hag: 410 },
      flash: '', slain: {}
    };
    this.timers = [];
  }
  componentDidMount() { if (this.props.autoplay !== false) this.bbLoop(); }
  componentWillUnmount() { this.bbClear(); }
  bbClear() { (this.timers || []).forEach(function (t) { clearTimeout(t); }); this.timers = []; }
  bbLater(fn, ms) { if (!this.timers) this.timers = []; this.timers.push(setTimeout(fn, ms)); }
  bbMax(id) { return { chunkus: 5000, golem: 5000, brute: 650, hag: 650 }[id]; }
  bbHit(id, amount) {
    var self = this, st = this.state;
    if (st.slain[id]) return;
    var hp = Object.assign({}, st.hp);
    hp[id] = Math.max(0, hp[id] - amount);
    var slain = Object.assign({}, st.slain);
    if (hp[id] === 0) slain[id] = true;
    this.setState({ hp: hp, flash: id + ':' + Date.now(), slain: slain });
    this.bbLater(function () { self.setState({ flash: '' }); }, 140);
    this.bbLater(function () { var c = Object.assign({}, self.state.chip); c[id] = self.state.hp[id]; self.setState({ chip: c }); }, 30);
    if (hp[id] === 0) {
      this.bbLater(function () {
        var h = Object.assign({}, self.state.hp), c = Object.assign({}, self.state.chip), s = Object.assign({}, self.state.slain);
        h[id] = self.bbMax(id); c[id] = h[id]; delete s[id];
        self.setState({ hp: h, chip: c, slain: s });
      }, 2600);
    }
  }
  bbLoop() {
    var self = this;
    var n = 0;
    function step() {
      n++;
      self.bbHit('chunkus', 90 + (n * 37) % 160);
      if (n % 2 === 0) self.bbHit('golem', 60 + (n * 53) % 120);
      if (n % 3 === 0) self.bbHit('brute', 18 + (n * 7) % 20);
      if (n % 3 === 1) self.bbHit('hag', 30 + (n * 11) % 40);
      self.bbLater(step, 650);
    }
    this.bbLater(step, 800);
  }
  renderVals() {
    var self = this, st = this.state;
    var nS = Number(this.props.stageBosses ?? 2), nM = Number(this.props.minibosses ?? 1);
    function fmt(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function bar(id, extra) {
      var max = self.bbMax(id), hp = st.hp[id], frac = hp / max;
      var flash = st.flash.indexOf(id + ':') === 0;
      return Object.assign({
        hp: String(hp), max: String(max), hpText: fmt(hp), maxText: fmt(max),
        hpPct: (frac * 100).toFixed(2) + '%', chipPct: (st.chip[id] / max * 100).toFixed(2) + '%',
        flash: flash, slain: !!st.slain[id], enraged: frac > 0 && frac <= 0.25
      }, extra(frac));
    }
    var stageDefs = [
      { id: 'chunkus', name: 'Big Chunkus', epithet: 'the Butcher of Route 9', statuses: [{ label: 'BURNING', c: '#D9763E' }, { label: 'CHILLED', c: '#7FB8CF' }] },
      { id: 'golem', name: 'Rock Golem', epithet: 'Quarry Saint', statuses: [{ label: 'POISONED', c: '#79B35F' }] }
    ].slice(0, nS);
    var stage = stageDefs.map(function (d) {
      return bar(d.id, function (f) {
        return { name: d.name, epithet: d.epithet, statuses: d.statuses, phases: ['66.6%', '33.3%'],
          fill: f <= 0.25 ? '#B3363F' : '#7E1820', barAnim: f > 0 && f <= 0.25 ? 'bbEnrage 0.8s ease-in-out infinite' : 'none' };
      });
    });
    var miniDefs = [{ id: 'brute', name: 'Brute Champion' }, { id: 'hag', name: 'Cornfield Hag' }].slice(0, nM);
    var minis = miniDefs.map(function (d) {
      return bar(d.id, function (f) { return { name: d.name, barAnim: f > 0 && f <= 0.25 ? 'bbEnrageMini 0.8s ease-in-out infinite' : 'none' }; });
    });
    var miniTop = 136 + nS * 112 + (nS ? 6 : 0);
    return {
      stage: stage, minis: minis, miniTop: String(miniTop), pointer: this.props.offscreenPointer !== false,
      controls: [
        { label: 'HIT BOSS', go: function () { self.bbHit('chunkus', 420); } },
        { label: 'BIG HIT', go: function () { self.bbHit('chunkus', 1400); } },
        { label: 'HIT MINIBOSS', go: function () { self.bbHit('brute', 60); } },
        { label: 'KILL MINIBOSS', go: function () { self.bbHit('brute', 9999); } }
      ]
    };
  }
}
</script>
</body>
</html>
