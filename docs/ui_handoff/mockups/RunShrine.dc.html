<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megaclonk — Shrine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&amp;family=Overpass:wght@400;600;800&amp;family=Special+Elite&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; font-family: 'Overpass', sans-serif; color: #E8E2D0; background-color: #8C978F; background-image: repeating-conic-gradient(#8F9A92 0 25%, #87928A 0 50%); background-size: 16px 16px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background-color: #1F2620; background-image: repeating-conic-gradient(#212821 0 25%, #1C221D 0 50%); background-size: 16px 16px"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(10,11,10,0.72)"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.6) 100%)"></div>

<div role="status" aria-label="Run status" style="position: absolute; left: 72px; top: 36px; display: flex; align-items: flex-end; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">LVL</span><span style="font-weight: 800; font-size: 32px; line-height: 1; text-shadow: 3px 3px 0 #050505">4</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">STAGE</span><span style="font-weight: 800; font-size: 32px; line-height: 1; text-shadow: 3px 3px 0 #050505">1</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 240px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">HP</span><div style="height: 24px; background: #2A1416; border: 2px solid #050505"><div style="width: 65%; height: 100%; background: #7E1820; display: flex; align-items: center; padding-left: 8px; box-sizing: border-box; font-weight: 800; font-size: 14px; color: #F4EFE2; white-space: nowrap">65 / 100</div></div></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">GOLD</span><span style="font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 #050505">88</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600; font-size: 13px; letter-spacing: 0.3em; color: #A9ADA4">TIME</span><span style="font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 3px 3px 0 #050505">01:35</span></div>
</div>

<div style="position: absolute; left: 72px; top: 150px"><dc-import name="RunInventory" weapons="3" ice="1" hint-size="420px,870px"></dc-import></div>
<div style="position: absolute; left: 1428px; top: 150px"><dc-import name="RunStats" damage="+0%" preview-key="damage" preview-to="+12%" hint-size="420px,870px"></dc-import></div>

<section aria-labelledby="shrine-h" style="position: absolute; left: 532px; top: 150px; width: 856px; height: 870px; box-sizing: border-box; padding: 32px 40px; background: rgba(14,15,14,0.94); border: 1px solid #4A4D47; display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-weight: 800; font-size: 14px; letter-spacing: 0.3em; color: #A9ADA4">SHRINE</span>
<h1 id="shrine-h" style="margin: 0; font-family: 'IM Fell English', serif; font-weight: 400; font-size: 52px; line-height: 1">Choose one stat</h1>
<div aria-hidden="true" style="width: 48px; height: 5px; background: #7E1820; margin-top: 4px"></div>
</div>
<span style="margin-top: 6px; font-size: 17px; color: #B9BAB1">Permanent for this run.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 22px; padding-top: 6px">

<button type="button" aria-pressed="false" style="position: relative; display: grid; grid-template-columns: 170px 1fr auto; align-items: center; gap: 24px; height: 150px; box-sizing: border-box; padding: 0 28px 0 24px; border: 4px solid #E0A33A; background-color: #E6D6A8; background-image: repeating-linear-gradient(115deg, rgba(255,240,190,0) 0px, rgba(255,240,190,0) 40px, rgba(255,244,205,0.55) 40px, rgba(255,244,205,0.55) 52px, rgba(255,240,190,0) 52px, rgba(255,240,190,0) 120px); color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: rotate(-0.4deg); box-shadow: 0 0 0 3px #3A2600, 0 0 46px 14px rgba(240,170,60,0.6), 5px 7px 0 rgba(0,0,0,0.5)">
<span aria-hidden="true" style="position: absolute; left: -4px; top: -20px; display: flex; align-items: center; gap: 6px; padding: 4px 12px 2px; background: #C9861A; color: #1C1A15; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.24em; box-shadow: 0 0 0 2px #3A2600"><svg width="12" height="12" viewBox="0 0 24 24" fill="#1C1A15"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg>LEGENDARY FIND<svg width="12" height="12" viewBox="0 0 24 24" fill="#1C1A15"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg></span>
<span style="font-size: 62px; line-height: 1; border-right: 1px dashed #A8874A; padding-right: 18px; color: #8A4F00">+25%</span>
<span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 28px; line-height: 1">Critical chance</span><span style="font-size: 17px; color: #4A3F28">Increases critical hit chance, capped at 100%.</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px"><span style="display: flex; align-items: center; gap: 6px; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.22em; color: #1C1A15; background: #C9861A; padding: 6px 10px 4px; transform: rotate(-5deg); box-shadow: 2px 2px 0 #3A2600"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#1C1A15"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg>LEGENDARY</span><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A4A2A">[1]</span></span>
</button>

<button type="button" aria-pressed="true" style="position: relative; display: grid; grid-template-columns: 170px 1fr auto; align-items: center; gap: 24px; height: 150px; box-sizing: border-box; padding: 0 28px 0 24px; border: 4px solid #2B6CB5; outline: 4px solid #B3363F; outline-offset: 6px; background: #D5D6CB; color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: translateX(-6px) rotate(0.3deg); box-shadow: 0 0 30px 8px rgba(70,140,220,0.5), 7px 9px 0 rgba(0,0,0,0.55)">
<span aria-hidden="true" style="position: absolute; left: -4px; top: -18px; display: flex; align-items: center; gap: 6px; padding: 4px 12px 2px; background: #2B6CB5; color: #F2F6FB; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.24em"><svg width="12" height="12" viewBox="0 0 24 24" fill="#F2F6FB"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg>RARE FIND</span>
<span style="font-size: 58px; line-height: 1; border-right: 1px dashed #8F876F; padding-right: 18px; color: #1F5A9C">+12%</span>
<span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 28px; line-height: 1">Damage</span><span style="font-size: 17px; color: #4A453A">Increases damage dealt by all weapons.</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px"><span style="display: flex; align-items: center; gap: 6px; font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.24em; color: #F2F6FB; background: #2B6CB5; padding: 6px 10px 4px; transform: rotate(-4deg); box-shadow: 2px 2px 0 #123457"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="#F2F6FB"><path d="M12 1l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"></path></svg>RARE</span><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A5446">[2]</span></span>
</button>

<button type="button" aria-pressed="false" style="display: grid; grid-template-columns: 170px 1fr auto; align-items: center; gap: 24px; height: 150px; box-sizing: border-box; padding: 0 28px 0 24px; border: none; background: #D3CBB2; color: #1C1A15; font-family: 'Special Elite', monospace; text-align: left; cursor: pointer; transform: rotate(0.5deg); box-shadow: 5px 7px 0 rgba(0,0,0,0.5)">
<span style="font-size: 58px; line-height: 1; border-right: 1px dashed #8F876F; padding-right: 18px">+5%</span>
<span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 28px; line-height: 1">XP gain</span><span style="font-size: 17px; color: #4A453A">Increases experience gained.</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px"><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.24em; color: #5A5446">COMMON</span><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.2em; color: #5A5446">[3]</span></span>
</button>

</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; color: #8D9188">Preview shown in Stats →</span>
<button type="button" style="display: flex; align-items: center; justify-content: space-between; height: 72px; padding: 0 26px; border: none; background: #7E1820; cursor: pointer; font-family: 'IM Fell English', serif; font-size: 36px; color: #F4EFE2"><span style="display: flex; align-items: center; gap: 16px"><span aria-hidden="true" style="width: 12px; height: 12px; background: #F4EFE2"></span>Accept: Damage +12%</span><span style="font-family: 'Overpass', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.2em; color: #F4C9CB">ENTER</span></button>
</div>

</section>

<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
